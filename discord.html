<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR MC - Discord Community</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1b223d 0%, #0f1016 100%);
            padding: 20px;
        }

        .page-wrapper {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .container {
            width: 100%;
            background: rgba(26, 29, 46, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            text-align: center;
        }

        /* البنر: إذا ماكو صورة أو كان الـ src فارغ/غير موجود، يختفي تلقائياً */
        .discord-banner:not([src]), 
        .discord-banner[src=""], 
        .discord-banner[src="#"] {
            display: none;
        }

        .discord-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #1a1d2e;
        }

        .content-body {
            padding: 30px;
            position: relative;
        }

        /* إذا البنر مخفي، نخلي مسافة الأيقونة الدائرية طبيعية وفوق */
        .discord-banner:not([src]) ~ .content-body .server-avatar,
        .discord-banner[src=""] ~ .content-body .server-avatar,
        .discord-banner[src="#"] ~ .content-body .server-avatar {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* أيقونة السيرفر الدائرية المتداخلة (في حال وجود بنر) */
        .server-avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 4px solid #1a1d2e;
            object-fit: cover;
            margin-top: -65px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            background: #0f1016;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 800;
        }

        .discord-tag {
            display: inline-block;
            background: rgba(88, 101, 242, 0.15);
            color: #7289da;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            border: 1px solid rgba(88, 101, 242, 0.3);
        }

        .description {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .stats-box {
            display: flex;
            justify-content: space-around;
            background: rgba(37, 40, 61, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .stat-item h4 {
            color: #22c55e;
            font-size: 18px;
            margin-bottom: 3px;
        }

        .stat-item span {
            color: #9ca3af;
            font-size: 12px;
        }

        .discord-btn {
            display: block;
            width: 100%;
            background: #5865F2;
            color: #ffffff;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        .back-btn {
            display: inline-block;
            background: rgba(37, 40, 61, 0.8);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #22c55e;
            color: #0f1016;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 24px;
            }
            .discord-banner {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="container">
            <img src="img-bnr/star.png" alt="Discord Banner" class="discord-banner">
            
            <div class="content-body">
                <img src="img-servers/s.png" alt="Server Avatar" class="server-avatar">
                
                <h1>STAR MC Community</h1>
                <div class="discord-tag">Official Discord Server</div>
                
                <p class="description">
                    انضم إلى مجتمعنا الرسمي على الديسكورد لتكن على اطلاع بأحدث التحديثات، الفعاليات، والتواصل مع اللاعبين والإدارة مباشرة.
                </p>

                <div class="stats-box">
                    <div class="stat-item">
                        <h4>163</h4>
                        <span>عضو متفاعل</span>
                    </div>
                    <div class="stat-item">
                        <h4>Online</h4>
                        <span>الحالة الآن</span>
                    </div>
                    <div class="stat-item">
                        <h4>24/7</h4>
                        <span>دعم فني</span>
                    </div>
                </div>

                <a href="https://discord.gg/qDRjs3Nzx" target="_blank" class="discord-btn">الانضمام إلى سيرفر الديسكورد ➔</a>
            </div>
        </div>

        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

</body>
</html>
