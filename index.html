<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORCH MC - Home</title>
    <!-- أيقونة الموقع المصغرة -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- مكتبة الأيقونات الفخمة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                #0b0c10;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(18, 20, 31, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .server-logo {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 3px solid rgba(34, 197, 94, 0.6);
            object-fit: cover;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.25);
            background: #12141f;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .description {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* تخطيط الأزرار الشبكي الحديث */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .btn {
            background: rgba(26, 29, 45, 0.7);
            color: #ffffff;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn i {
            font-size: 16px;
            color: #3b82f6;
            transition: transform 0.3s;
        }

        .btn:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #22c55e;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn:hover i {
            transform: scale(1.15);
            color: #22c55e;
        }

        /* زر الديسكورد المميز بعرض كامل */
        .discord-full-btn {
            grid-column: span 2;
            background: rgba(88, 101, 242, 0.15);
            border-color: rgba(88, 101, 242, 0.3);
            color: #7289da;
        }

        .discord-full-btn i {
            color: #5865F2;
        }

        .discord-full-btn:hover {
            background: #5865F2;
            border-color: #5865F2;
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
        }

        .discord-full-btn:hover i {
            color: #ffffff;
        }

        /* قسم التيليجرام */
        .telegram-section {
            margin-top: 15px;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .telegram-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        /* التجاوب مع شاشات الهواتف */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .description {
                font-size: 13px;
                margin-bottom: 25px;
            }

            .nav-grid {
                grid-template-columns: 1fr;
            }

            .discord-full-btn {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار السيرفر -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="Torch MC Logo" class="server-logo">
        </div>
        
        <h1>TORCH MC</h1>
        
        <!-- الوصف -->
        <p class="description">
            الموقع الرسمي والمنصة المتكاملة لكل ما يخص Minecraft. استكشف أقسام السيرفرات، المودات، والإعدادات بكل سهولة.
        </p>
        
        <!-- شبكة الأزرار الحديثة -->
        <div class="nav-grid">
            <a href="servrs.html" class="btn">
                <i class="fa-solid fa-server"></i> Servers
            </a>
            
            <a href="mods.html" class="btn">
                <i class="fa-solid fa-cube"></i> Mods
            </a>

            <a href="config.html" class="btn">
                <i class="fa-solid fa-sliders"></i> Configs
            </a>

            <a href="pro.html" target="_blank" class="btn">
                <i class="fa-solid fa-code"></i> المطورين
            </a>

            <!-- زر الديسكورد العريض -->
            <a href="discord.html" class="btn discord-full-btn">
                <i class="fa-brands fa-discord"></i> Discord Community
            </a>
        </div>

        <!-- زر التيليجرام البارز بالأسفل -->
        <div class="telegram-section">
            <a href="https://t.me/AUNER_0" target="_blank" class="telegram-btn">
                <i class="fa-brands fa-telegram"></i> Join Telegram
            </a>
        </div>
    </div>

</body>
</html>
