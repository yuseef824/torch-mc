<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORCH MC - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #1b223d 0%, #0f1016 100%);
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(26, 29, 46, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .server-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #22c55e;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        h1 {
            font-size: 34px;
            margin-bottom: 12px;
            background: linear-gradient(45deg, #22c55e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .description {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* حاوية الأزرار الرئيسية */
        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 35px;
        }

        .row-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            background: #25283d;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background: #22c55e;
            color: #0f1016;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }

        .telegram-section {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
        }

        .telegram-btn {
            display: inline-block;
            background: linear-gradient(45deg, #22c55e, #16a34a);
            color: #ffffff;
            text-align: center;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .telegram-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* التجاوب التام مع شاشات الهواتف المحمولة */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 15px;
                border-radius: 16px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 13px;
                margin-bottom: 20px;
            }

            /* تحويل صفوف الأزرار إلى عمودية في شاشات الموبايل لسهولة الضغط */
            .row-btns {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                padding: 13px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Torch MC Logo" class="server-logo">
        
        <h1> TORCH MC </h1>
        
        <link rel="icon" type="logo.png" href="logo.png">
        <!-- الوصف -->
        <p class="description">
            الموقع الرسمي والمنصة المتكاملة لكل ما يخص Minecraft. استكشف أقسام السيرفرات، المودات، والإعدادات بكل سهولة.
        </p>
        
        <!-- قسم الأزرار -->
        <div class="nav-section">
            <div class="row-btns">
                <a href="servrs.html" class="btn"> Servers </a>
                <a href="mods.html" class="btn"> Mods </a>
            </div>

            <!-- زر الديسكورد بتصميم متجاوب وبحجم كامل -->
            <a href="discord.html" class="btn" style="background-color: #5865F2; border-color: #5865F2; display: block; width: 100%;">discord</a>

            <div class="row-btns">
                <a href="pro.html" target="_blank" class="btn"> المطورين</a>
                <a href="config.html" class="btn"> Configs </a>
            </div>
        </div>

        <!-- قسم قناة التليجرام بالأسفل -->
        <div class="telegram-section">
            <a href="https://t.me/@AUNER_0" target="_blank" class="telegram-btn">Join Telegram</a>
        </div>
    </div>

</body>
</html>
