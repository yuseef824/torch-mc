<style>
    body {
      background-color: #313442;
      /* حط رابط الصورة هنا إذا تريد تخلي نفس خلفية موقعك */
      background-image: url('رابط_الصورة_هنا');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #1a1d2d;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .server-card {
      background: #25283d;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-align: left;
    }
    .server-card img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }
    .server-info {
      flex-grow: 1;
    }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #000;
      padding: 8px 15px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      transition: 0.3s;
    }
    .btn:hover {
      background: #16a34a;
    }
    .back-btn {
      display: block;
      width: fit-content;
      margin: 20px auto;
      background: #22c55e;
      color: #000;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
</style>
