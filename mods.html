<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORCH MC - Mods</title>
    <!-- أيقونة الموقع المصغرة -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                #0b0c10;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(18, 20, 31, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* صندوق البحث بتصميم الهوم */
        #searchInput {
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 30px;
            background: rgba(26, 29, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #searchInput:focus {
            background: rgba(34, 197, 94, 0.05);
            border-color: rgba(34, 197, 94, 0.4);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }

        #searchInput::placeholder {
            color: #6b7280;
        }

        /* شبكة المودات (3 أعمدة) */
        #modsList {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* تخصيص شريط التمرير */
        #modsList::-webkit-scrollbar {
            width: 6px;
        }
        #modsList::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* كارت المود بتصميم بطاقات الهوم */
        .mod-card {
            background: rgba(26, 29, 45, 0.7);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            position: relative;
        }

        .mod-card:hover {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .mod-card img {
            width: 65px;
            height: 65px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(34, 197, 94, 0.4);
            background: #12141f;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }

        .mod-info {
            width: 100%;
        }

        .mod-info h3 {
            color: #ffffff;
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .mod-info p {
            color: #9ca3af;
            margin: 0;
            font-size: 12px;
        }

        .download-btn {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            border: 1px solid rgba(34, 197, 94, 0.3);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }

        .mod-card:hover .download-btn {
            background: #22c55e;
            color: #0b0c10;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        /* زر العودة بتصميم أزرار الهوم */
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 200px;
            margin: 30px auto 0 auto;
            background: rgba(26, 29, 45, 0.7);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* التجاوب مع شاشات الهواتف */
        @media (max-width: 768px) {
            #modsList {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 25px 15px;
                border-radius: 20px;
            }
            #modsList {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mods</h1>
        
        <!-- حقل البحث -->
        <input type="text" id="searchInput" placeholder="Search mods..." onkeyup="searchMods()">
        
        <!-- قائمة المودات (3 أعمدة) -->
        <div id="modsList">
            <!-- Sodium -->
            <a href="https://modrinth.com/mod/sodium/versions" target="_blank" class="mod-card">
                <img src="img-mods/sodium.png" alt="Sodium">
                <div class="mod-info">
                    <h3>Sodium</h3>
                    <p>1.14.2 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>

            <!-- Fabric API -->
            <a href="https://modrinth.com/mod/fabric-api/versions" target="_blank" class="mod-card">
                <img src="img-mods/FabricAPI.png" alt="Fabric API">
                <div class="mod-info">
                    <h3>Fabric API</h3>
                    <p>1.14 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>

            <!-- Iris Shaders -->
            <a href="https://modrinth.com/mod/iris/versions" target="_blank" class="mod-card">
                <img src="img-mods/irs.png" alt="Iris Shaders">
                <div class="mod-info">
                    <h3>Iris Shaders</h3>
                    <p>1.16.5 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>
        
            <!-- Cloth Config API -->
            <a href="https://modrinth.com/mod/cloth-config/versions" target="_blank" class="mod-card">
                <img src="img-mods/Cloth.png" alt="Cloth Config API">
                <div class="mod-info">
                    <h3>Cloth Config</h3>
                    <p>1.14 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>

            <!-- Mod Menu -->
            <a href="https://modrinth.com/mod/modmenu/versions" target="_blank" class="mod-card">
                <img src="img-mods/mn.png" alt="Mod Menu">
                <div class="mod-info">
                    <h3>Mod Menu</h3>
                    <p>1.14.4 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>  
        
            <a href="https://modrinth.com/mod/architectury-api/versions" target="_blank" class="mod-card">
                <img src="img-mods/arc.png" alt="Mod Menu">
                <div class="mod-info">
                    <h3>Architectury API</h3>
                    <p>1.16.5 - 2.26</p>
                </div>
                <span class="download-btn"><i class="fa-solid fa-download"></i> Download</span>
            </a>  
        </div>

        <!-- زر العودة -->
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <script>
        // سكربت البحث
        function searchMods() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('mod-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
